<text x="35" y="1115" font-family="Arial" font-size="25" font-weight="normal" fill="#142C3E">Feedback: correct evidence, reconsider terms, review servicing and approve each new release.</text>
<text x="35" y="1159" font-family="Arial" font-size="25" font-weight="normal" fill="#142C3E">Research interfaces: offer allocation, sequential control, selection analysis and Treasury models.</text>
<text x="35" y="1195" font-family="Arial" font-size="25" font-weight="normal" fill="#142C3E">The full diagrams show the decision branches, approval gates and return paths.</text>
