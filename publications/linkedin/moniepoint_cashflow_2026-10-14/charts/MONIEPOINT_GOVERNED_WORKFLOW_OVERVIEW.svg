<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1210" viewBox="0 0 1500 1210"><rect width="100%" height="100%" fill="white"/>
<text x="35" y="62" font-family="Arial" font-size="42" font-weight="bold" fill="#142C3E">Governed cash-flow credit workflow</text>
<text x="35" y="105" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Moniepoint application of the five-article causal credit series</text>
<rect x="35" y="150" width="440" height="230" fill="#F0F4F7" stroke="#6B8190" stroke-width="2"/>
<text x="51" y="195" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">1  Evidence and identity</text>
<text x="51" y="242" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Case and correlation ID</text>
<text x="51" y="277" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Permissions and coverage</text>
<text x="51" y="312" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Provenance and cutoff</text>
<text x="51" y="347" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Article 5</text>
<rect x="530" y="150" width="440" height="230" fill="#EAF2F8" stroke="#6B8190" stroke-width="2"/>
<text x="546" y="195" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">2  Reproducible analysis</text>
<text x="546" y="242" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Cash, rules and rolling measures</text>
<text x="546" y="277" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Dated repayment paths</text>
<text x="546" y="312" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Credible and predictive</text>
<text x="546" y="347" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">uncertainty - Articles 2, 5</text>
<rect x="1025" y="150" width="440" height="230" fill="#F3EEFA" stroke="#6B8190" stroke-width="2"/>
<text x="1041" y="195" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">3  Policy and support</text>
<text x="1041" y="242" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Eligible actions and limits</text>
<text x="1041" y="277" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Evidence support - Article 3</text>
<text x="1041" y="312" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Approved experiments</text>
<text x="1041" y="347" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">and logged probabilities - A1</text>
<rect x="35" y="470" width="440" height="230" fill="#FFF4D6" stroke="#6B8190" stroke-width="2"/>
<text x="51" y="515" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">4  Meaningful review</text>
<text x="51" y="562" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Inspect evidence and options</text>
<text x="51" y="597" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Amend, defer or approve</text>
<text x="51" y="632" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Independent checker</text>
<text x="51" y="667" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">where required - Article 5</text>
<rect x="530" y="470" width="440" height="230" fill="#EAF2F8" stroke="#6B8190" stroke-width="2"/>
<text x="546" y="515" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">5  Authorised execution</text>
<text x="546" y="562" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Expiring instruction</text>
<text x="546" y="597" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Separate execution service</text>
<text x="546" y="632" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Receipt and loan ledger</text>
<text x="546" y="667" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Reconciled cash - Article 5</text>
<rect x="1025" y="470" width="440" height="230" fill="#FFF4D6" stroke="#6B8190" stroke-width="2"/>
<text x="1041" y="515" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">6  Monitor and support</text>
<text x="1041" y="562" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Check coverage first</text>
<text x="1041" y="597" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Review verified changes</text>
<text x="1041" y="632" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Customer conversation</text>
<text x="1041" y="667" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Sequential service - Article 2</text>
<rect x="35" y="790" width="440" height="230" fill="#EAF2F8" stroke="#6B8190" stroke-width="2"/>
<text x="51" y="835" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">7  Observed outcomes</text>
<text x="51" y="882" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Assignment versus delivery</text>
<text x="51" y="917" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Cash, arrears and recovery</text>
<text x="51" y="952" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Customer outcomes</text>
<text x="51" y="987" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Evaluation - Articles 1-3</text>
<rect x="530" y="790" width="440" height="230" fill="#F3EEFA" stroke="#6B8190" stroke-width="2"/>
<text x="546" y="835" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">8  Portfolio interface</text>
<text x="546" y="882" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Aggregate cash and drawings</text>
<text x="546" y="917" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Funding and risk scenarios</text>
<text x="546" y="952" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Treasury and ALCO authority</text>
<text x="546" y="987" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Article 4</text>
<rect x="1025" y="790" width="440" height="230" fill="#F3EEFA" stroke="#6B8190" stroke-width="2"/>
<text x="1041" y="835" font-family="Arial" font-size="30" font-weight="bold" fill="#142C3E">9  Controlled learning</text>
<text x="1041" y="882" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Replay and validation</text>
<text x="1041" y="917" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Shadow and bounded pilot</text>
<text x="1041" y="952" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Version, expiry and rollback</text>
<text x="1041" y="987" font-family="Arial" font-size="27" font-weight="normal" fill="#142C3E">Article 5</text>
